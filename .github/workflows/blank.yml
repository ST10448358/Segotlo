# This is a basic workflow to help you get started with Actions

name: Android CI - Build & Test

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build-and-test:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
     # 1. Get the code from your repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Set up Java (Android Studio uses Java 17 now)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 3. Make the gradlew script executable
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. Run the Unit Tests (The one we created)
    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest

    # 5. Build the Debug APK (This compiles the app)
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # 6. Upload the APK so you can download it from GitHub
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: Segotlo-App-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
